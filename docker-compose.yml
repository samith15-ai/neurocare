version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: neurocare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurocare_user
      POSTGRES_PASSWORD: neurocare_password
      POSTGRES_DB: neurocare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurocare_user -d neurocare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: neurocare_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://neurocare_user:neurocare_password@db:5432/neurocare_db
      USE_SQLITE: "False"
      ENVIRONMENT: production
      APP_SECRET_KEY: neurocare_production_jwt_secret_key_change_me_super_secure
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: neurocare_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
