services:
  - type: web
    name: neurocare-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: USE_SQLITE
        value: false
      - key: DATABASE_URL
        sync: false # Set to your Supabase PostgreSQL connection URI in Render Dashboard
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
